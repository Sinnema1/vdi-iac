---
# Repository validation.
#
# Stages are added only when the repository contains the responsibility they
# validate. PowerShell and manifest jobs came with Increment 1; the Packer job
# came with Increment 2's lab harness. There is still no Terraform job, because
# there are no Terraform files yet. Add each stage with the increment that
# introduces it.
#
# The Packer job checks the harness configuration. It does not run a lab: that
# needs a disposable Windows target, which CI does not have.
#
# Actions are pinned to full commit SHAs rather than tags, because a tag can be
# moved to point at different code after review. The trailing comment records
# which release each SHA corresponds to; update both together.
name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-boundary:
    name: Public repository boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for organization-identifying content
        run: scripts/ci/check-public-boundary.sh

  boundary-tests:
    name: Boundary check regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run scanner regression tests
        run: tests/test-public-boundary.sh

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the scan covers every commit, not just the tip.
          fetch-depth: 0
      # v3 runs on Node 24. v2 runs on Node 20, which is removed from
      # GitHub-hosted runners on 16 September 2026.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"

  powershell:
    # Path confinement depends on filesystem semantics that differ between
    # platforms: separators, case sensitivity, and reparse points. Windows is
    # the target platform for the guest side, so the suite runs on both.
    name: PowerShell analysis and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Well above the few minutes this takes, and far below the six-hour default.
    # A stalled step should report a failure while someone is still watching.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The harness tests shell out to packer, and a runner's preinstalled
      # version is whatever the image carries. Pinning the file and then
      # validating it with a different binary tests nothing.
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: 1.15.4
      - name: Install pinned plugins
        # The builder tests shell out to packer validate, which needs the
        # vSphere plugin present. Without this they fail on a missing plugin
        # rather than on anything they are testing.
        run: packer init packer/builds
      - name: Install modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.1.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
      - name: PSScriptAnalyzer
        shell: pwsh
        # A Windows run of this step once sat for over twenty minutes against
        # roughly three seconds on other platforms, with the same pinned
        # analyzer version. The cause is not established: the suspicion is
        # command-name resolution walking a large module path, but disabling
        # auto-loading makes the analyzer's own cmdlet unresolvable, so no
        # mitigation is applied here on a single observation. The job carries a
        # timeout so a repeat fails quickly, and the timing below will say which
        # directory is responsible.
        run: |
          # Every directory holding PowerShell, not only the first one that did.
          # Timed per path so a future stall names the directory rather than
          # leaving the whole step opaque.
          $findings = foreach ($path in @('./source-qualification', './scripts/ci', './packer/scripts')) {
            $watch = [System.Diagnostics.Stopwatch]::StartNew()
            $result = Invoke-ScriptAnalyzer -Path $path -Recurse -Severity Error,Warning
            Write-Host ("  {0,-26} {1,6:N1}s" -f $path, $watch.Elapsed.TotalSeconds)
            $result
          }
          if ($findings) {
            $findings | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message | Out-String -Width 200 | Write-Host
            throw "PSScriptAnalyzer reported $($findings.Count) finding(s)."
          }
          Write-Host 'PSScriptAnalyzer: clean'
      - name: Pester
        shell: pwsh
        run: |
          # A mandatory parameter left unbound prompts rather than throwing, and
          # a prompt in CI is an hour of a runner waiting for a keystroke that
          # never comes. This turns that into an immediate failure.
          $ConfirmPreference = 'None'
          $config = New-PesterConfiguration
          $config.Run.Path = './source-qualification/tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  manifest-contract:
    name: Manifest contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate committed manifests
        shell: pwsh
        run: |
          # Import-PackageManifest, not Test-Json: schema validation alone misses
          # the semantic rules, so a manifest with duplicate ids or duplicate
          # order values would pass a schema-only gate.
          Import-Module ./source-qualification/scripts/PackageManifest.psm1 -Force
          $manifests = Get-ChildItem -Path 'packer/manifests' -Filter '*.json' -File -ErrorAction SilentlyContinue
          if (-not $manifests) { throw 'No manifests found to validate.' }
          $failed = @()
          foreach ($m in $manifests) {
            try {
              $parsed = Import-PackageManifest -Path $m.FullName
              Write-Host "  valid   $($m.Name) ($($parsed.Packages.Count) package(s))"
            }
            catch {
              Write-Host "  INVALID $($m.Name): $($_.Exception.Message)"
              $failed += $m.Name
            }
          }
          if ($failed) { throw "Manifests failed validation: $($failed -join ', ')" }

      - name: Validate committed media references
        shell: pwsh
        run: |
          # The example is the shape people copy. One that does not validate
          # fails only when someone tries to build from it.
          Import-Module ./source-qualification/scripts/MediaQualification.psm1 -Force
          $examples = Get-ChildItem -Path 'packer/media' -Filter '*.media.json.example' -File -Recurse -ErrorAction SilentlyContinue
          if (-not $examples) { throw 'No media reference examples found to validate.' }
          foreach ($e in $examples) {
            # Copied to a real name first: Import-MediaReference validates the
            # document, and the extension is not what makes it valid.
            $probe = Join-Path ([System.IO.Path]::GetTempPath()) ([guid]::NewGuid().ToString() + '.json')
            Copy-Item -LiteralPath $e.FullName -Destination $probe
            Import-MediaReference -Path $probe | Out-Null
            Write-Host "  valid   $($e.Name)"
          }

          # The whole tree, not just packer/media. The convention is
          # packer/media/**/*.media.json, but a live reference dropped anywhere
          # else is exactly as published, and a guard that only looks where the
          # convention says would miss it. This repository is a reference
          # implementation and carries the synthetic example only; a live
          # reference belongs in a private or otherwise access-controlled
          # repository that consumes this one to operate a build.
          $live = Get-ChildItem -Path . -Filter '*.media.json' -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' }
          if ($live) { throw "A live media reference is committed: $($live.FullName -join ', ')" }

  packer-harness:
    name: Packer harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: 1.15.4
      - name: Format check
        run: packer fmt -check -recursive packer/harness packer/builds

      - name: Install pinned plugins
        # The build configuration declares the vSphere plugin. Without init,
        # validate cannot resolve the source block and reports nothing useful.
        run: packer init packer/builds
      - name: Validate the harness
        shell: pwsh
        run: |
          # A full validate, not -syntax-only: it resolves file provisioner
          # sources, so a harness pointing at a directory that does not exist
          # fails here rather than in a lab.
          $work = Join-Path ([System.IO.Path]::GetTempPath()) ([guid]::NewGuid().ToString())
          $bundle = Join-Path $work 'bundle'
          $evidence = Join-Path $work 'evidence'
          New-Item -ItemType Directory -Path $bundle, $evidence -Force | Out-Null
          $varFile = Join-Path $work 'vars.pkrvars.hcl'
          @"
          cleanup_nonce                   = "0123456789abcdef0123456789abcdef"
          contracts_source_dir            = "$((Join-Path $PWD 'contracts') -replace '\\', '/')"
          guest_host                      = "windows-lab-target.example"
          guest_username                  = "labuser"
          guest_password                  = "placeholder"
          acknowledge_destructive_lab_run = true
          lab_marker_path                 = "C:/vdi-iac-lab/lab-marker.txt"
          lab_marker_nonce                = "placeholder-nonce"
          run_id                          = "3f2504e0-4f89-41d3-9a0c-0305e82c3301"
          bundle_path                     = "$($bundle -replace '\\', '/')"
          descriptor_sha256               = "$('a' * 64)"
          evidence_output_dir             = "$($evidence -replace '\\', '/')"
          tools_source_dir                = "$((Join-Path $PWD 'source-qualification' 'scripts') -replace '\\', '/')"
          guest_scripts_dir               = "$((Join-Path $PWD 'packer' 'scripts' 'guest') -replace '\\', '/')"
          "@.Split("`n").TrimStart() -join "`n" | Set-Content -LiteralPath $varFile -Encoding utf8

          packer validate "-var-file=$varFile" packer/harness
      - name: Refuse to validate without a target
        shell: pwsh
        run: |
          # No usable defaults: an unset target must be an error, never a
          # fallback to whatever happens to be reachable.
          #
          # ErrorActionPreference is lowered deliberately. This shell runs with
          # it set to Stop, which turns a native command's stderr into a
          # terminating error -- so the step would fail on packer's expected
          # complaint before reaching the assertion about it.
          $ErrorActionPreference = 'Continue'
          $output = (packer validate packer/harness 2>&1) -join "`n"
          if ($LASTEXITCODE -eq 0) { throw 'The harness validated with no target configured.' }
          Write-Host "harness refuses an unconfigured target (packer exit $LASTEXITCODE)"

          # The step inherits the last exit code, and packer's expected non-zero
          # would fail a step whose assertion just passed.
          exit 0

  packer-build-config:
    name: Packer build configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: 1.15.4
      - name: Install pinned plugins
        run: packer init packer/builds
      - name: Validate the build configuration
        shell: pwsh
        run: |
          # Configuration only. This resolves references and checks the
          # configuration; it says nothing about vCenter connectivity, media
          # reachability, boot behaviour, or whether a build converts to a
          # template. Nothing in CI runs a build.
          $work = Join-Path ([System.IO.Path]::GetTempPath()) ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $work 'bundle') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $work 'evidence') -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $work 'autounattend.xml') -Value '<x/>' -NoNewline
          Set-Content -LiteralPath (Join-Path $work 'bootstrap.ps1') -Value '# bootstrap' -NoNewline
          Set-Content -LiteralPath (Join-Path $work 'media.iso') -Value 'media' -NoNewline
          Set-Content -LiteralPath (Join-Path $work 'qualification.json') -Value '{}' -NoNewline

          $varFile = Join-Path $work 'vars.pkrvars.hcl'
          @"
          vcenter_server              = "vcenter.example"
          vcenter_username            = "builder@example"
          vcenter_password            = "placeholder"
          vcenter_insecure_connection = false
          datacenter                  = "example-datacenter"
          cluster                     = "example-cluster"
          datastore                   = "example-datastore"
          network                     = "example-network"
          folder                      = "example-folder"
          run_id                      = "3f2504e0-4f89-41d3-9a0c-0305e82c3301"
          candidate_name              = "windows-candidate"
          media_url                   = "$((Join-Path $work 'media.iso') -replace '\\', '/')"
          media_checksum              = "sha256:$('0' * 64)"
          answer_file_path            = "$((Join-Path $work 'autounattend.xml') -replace '\\', '/')"
          winrm_bootstrap_path        = "$((Join-Path $work 'bootstrap.ps1') -replace '\\', '/')"
          bundle_path                 = "$((Join-Path $work 'bundle') -replace '\\', '/')"
          media_qualification_record_path = "$((Join-Path $work 'qualification.json') -replace '\\', '/')"
          vmware_tools_version        = "12.5.0"
          finalization_nonce          = "0123456789abcdef0123456789abcdef"
          descriptor_sha256           = "$('a' * 64)"
          tools_source_dir            = "$((Join-Path $PWD 'source-qualification' 'scripts') -replace '\\', '/')"
          guest_scripts_dir           = "$((Join-Path $PWD 'packer' 'scripts' 'guest') -replace '\\', '/')"
          contracts_source_dir        = "$((Join-Path $PWD 'contracts') -replace '\\', '/')"
          evidence_output_dir         = "$((Join-Path $work 'evidence') -replace '\\', '/')"
          hardware_version            = 21
          firmware                    = "efi-secure"
          virtual_tpm                 = true
          disk_controller_type        = "pvscsi"
          disk_size_gb                = 80
          cpus                        = 4
          memory_mb                   = 8192
          guest_os_type               = "windows11_64Guest"
          build_username              = "Administrator"
          build_password              = "placeholder"
          "@.Split("`n").TrimStart() -join "`n" | Set-Content -LiteralPath $varFile -Encoding utf8

          packer validate "-var-file=$varFile" packer/builds
      - name: Refuse to validate without inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $null = packer validate packer/builds 2>&1
          if ($LASTEXITCODE -eq 0) { throw 'The build validated with nothing configured.' }
          Write-Host "build refuses an unconfigured run (packer exit $LASTEXITCODE)"
          exit 0

  shell-lint:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        run: shellcheck scripts/ci/*.sh scripts/hooks/* tests/*.sh
