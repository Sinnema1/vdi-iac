---
# Repository validation.
#
# Stages are added only when the repository contains the responsibility they
# validate. PowerShell and manifest jobs exist because Increment 1 added source
# qualification and a manifest contract. There is still no Packer or Terraform
# job, because there are no such files yet. Add each stage with the increment
# that introduces it.
#
# Actions are pinned to full commit SHAs rather than tags, because a tag can be
# moved to point at different code after review. The trailing comment records
# which release each SHA corresponds to; update both together.
name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-boundary:
    name: Public repository boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for organization-identifying content
        run: scripts/ci/check-public-boundary.sh

  boundary-tests:
    name: Boundary check regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run scanner regression tests
        run: tests/test-public-boundary.sh

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the scan covers every commit, not just the tip.
          fetch-depth: 0
      # v3 runs on Node 24. v2 runs on Node 20, which is removed from
      # GitHub-hosted runners on 16 September 2026.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"

  powershell:
    # Path confinement depends on filesystem semantics that differ between
    # platforms: separators, case sensitivity, and reparse points. Windows is
    # the target platform for the guest side, so the suite runs on both.
    name: PowerShell analysis and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The harness tests shell out to packer, and a runner's preinstalled
      # version is whatever the image carries. Pinning the file and then
      # validating it with a different binary tests nothing.
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: 1.15.4
      - name: Install modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.1.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          # Every directory holding PowerShell, not only the first one that did.
          $findings = @('./source-qualification', './scripts/ci', './packer/scripts') |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Recurse -Severity Error,Warning }
          if ($findings) {
            $findings | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message | Out-String -Width 200 | Write-Host
            throw "PSScriptAnalyzer reported $($findings.Count) finding(s)."
          }
          Write-Host 'PSScriptAnalyzer: clean'
      - name: Pester
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './source-qualification/tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  manifest-contract:
    name: Manifest contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate committed manifests
        shell: pwsh
        run: |
          # Import-PackageManifest, not Test-Json: schema validation alone misses
          # the semantic rules, so a manifest with duplicate ids or duplicate
          # order values would pass a schema-only gate.
          Import-Module ./source-qualification/scripts/PackageManifest.psm1 -Force
          $manifests = Get-ChildItem -Path 'packer/manifests' -Filter '*.json' -File -ErrorAction SilentlyContinue
          if (-not $manifests) { throw 'No manifests found to validate.' }
          $failed = @()
          foreach ($m in $manifests) {
            try {
              $parsed = Import-PackageManifest -Path $m.FullName
              Write-Host "  valid   $($m.Name) ($($parsed.Packages.Count) package(s))"
            }
            catch {
              Write-Host "  INVALID $($m.Name): $($_.Exception.Message)"
              $failed += $m.Name
            }
          }
          if ($failed) { throw "Manifests failed validation: $($failed -join ', ')" }

  packer-harness:
    name: Packer harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: 1.15.4
      - name: Format check
        run: packer fmt -check -recursive packer/harness
      - name: Validate the harness
        shell: pwsh
        run: |
          # A full validate, not -syntax-only: it resolves file provisioner
          # sources, so a harness pointing at a directory that does not exist
          # fails here rather than in a lab.
          $work = Join-Path ([System.IO.Path]::GetTempPath()) ([guid]::NewGuid().ToString())
          $bundle = Join-Path $work 'bundle'
          $evidence = Join-Path $work 'evidence'
          New-Item -ItemType Directory -Path $bundle, $evidence -Force | Out-Null
          $varFile = Join-Path $work 'vars.pkrvars.hcl'
          @"
          guest_host                      = "windows-lab-target.example"
          guest_username                  = "labuser"
          guest_password                  = "placeholder"
          acknowledge_destructive_lab_run = true
          lab_marker_path                 = "C:/vdi-iac-lab/lab-marker.txt"
          lab_marker_nonce                = "placeholder-nonce"
          run_id                          = "3f2504e0-4f89-41d3-9a0c-0305e82c3301"
          bundle_path                     = "$bundle"
          descriptor_sha256               = "$('a' * 64)"
          evidence_output_dir             = "$evidence"
          tools_source_dir                = "$(Join-Path $PWD 'source-qualification' 'scripts')"
          guest_scripts_dir               = "$(Join-Path $PWD 'packer' 'scripts' 'guest')"
          "@.Split("`n").TrimStart() -join "`n" | Set-Content -LiteralPath $varFile -Encoding utf8

          packer validate "-var-file=$varFile" packer/harness
      - name: Refuse to validate without a target
        shell: pwsh
        run: |
          # No usable defaults: an unset target must be an error, never a
          # fallback to whatever happens to be reachable.
          #
          # ErrorActionPreference is lowered deliberately. This shell runs with
          # it set to Stop, which turns a native command's stderr into a
          # terminating error -- so the step would fail on packer's expected
          # complaint before reaching the assertion about it.
          $ErrorActionPreference = 'Continue'
          $output = (packer validate packer/harness 2>&1) -join "`n"
          if ($LASTEXITCODE -eq 0) { throw 'The harness validated with no target configured.' }
          Write-Host "harness refuses an unconfigured target (packer exit $LASTEXITCODE)"

  shell-lint:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        run: shellcheck scripts/ci/*.sh scripts/hooks/* tests/*.sh
